{% extends "layout/base.html" %}

{% block titulo %}
Novo Chamado
{% endblock %}

{% block conteudo %}

<div class="container">

    <h2>Novo Chamado</h2>

    <hr>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">Título</label>

            #título

            <input
                   type="text"
                   name="titulo"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Descrição</label>

            #descrição

            <textarea
                name="descricao"
                class="form-control"
                rows="5"
                required></textarea>

        </div>

        <div class="mb-3">
            <select
                name="categoria"
                class="form-select">

                <option>Hardware</option>
                <option>Software</option>
                <option>Rede</option>
                <option>Impressora</option>

            </select>

            #prioridade
             
            <select
             name="prioridade"
             class="form-select">

             <option>Baixa</option>
             <option>Média</option>
             <option>Alta</option>

            </select>

            <div class="col-md-6">

    <label class="form-label">Status</label>

    <select
        name="status"
        class="form-select"
        required>

        <option value="Aberto" selected>Aberto</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Resolvido">Resolvido</option>
        <option value="Fechado">Fechado</option>

    </select>

</div>

            #solicitante

            <input
                type="text"
                name="solicitante"
                class="form-control"
                required>


        </div>

        <button
            class="btn btn-primary">

            Salvar

        </button>

    </form>

</div>

{% endblock %}
