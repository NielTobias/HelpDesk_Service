{% extends "layout/base.html" %}

{% block titulo %}
Novo Chamado
{% endblock %}

{% block conteudo %}

<div class="container">

    <h2>Novo Chamado</h2>

    <hr>

    <form>

        <div class="mb-3">

            <label class="form-label">Título</label>

            <input
                type="text"
                class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Descrição</label>

            <textarea
                class="form-control"
                rows="5"></textarea>

        </div>

        <button
            class="btn btn-primary">

            Salvar

        </button>

    </form>

</div>

{% endblock %}
