{% extends "layout/base.html" %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">Login</h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">E-mail</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Senha</label>

                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Entrar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
